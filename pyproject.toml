[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "tel-d"
version = "0.1.0"
description = "Telegram chat dumper to structured markdown under 9MB - بدون سلف‌بات"
requires-python = ">=3.9"
dependencies = ["telethon>=1.34.0", "python-dotenv>=1.0.0"]

[project.scripts]
tel-d = "tel_d.cli:main"
